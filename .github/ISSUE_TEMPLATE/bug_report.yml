name: Bug report
description: Something does not work as the README says.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The Version line of `python -m pip show remote-contract-jobs`, or the git commit if you run from source.
    validations:
      required: true
  - type: input
    id: sources
    attributes:
      label: Source id(s) involved
      description: Ids from `remote-contract-jobs sources`, for example himalayas, remotive, hn. Write "all" or "not sure" if you do not know.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - MCP server
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or tool call
      description: The full command line, or the `search_jobs` arguments. Say whether you used a config file.
      render: shell
    validations:
      required: true
  - type: input
    id: job_url
    attributes:
      label: Sample job URL
      description: A link to one public post that shows the problem, such as a wrongly kept or wrongly dropped job.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the `source_errors` and `filtered_out` parts of the JSON output if they apply.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
